[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-entropy-thesis"
version = "0.1.0"
description = "Minimal research scaffold for semantic entropy thesis experiments."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
semantic-entropy-normalize-fixture = "semantic_entropy.fixtures:main"
semantic-entropy-metrics-jsonl = "semantic_entropy.metrics:main"
semantic-entropy-make-presampling-jsonl = "semantic_entropy.harness:main"
semantic-entropy-plot-curves = "semantic_entropy.plotting:main"
semantic-entropy-plot-extensions = "semantic_entropy.plotting_extensions:main"
semantic-entropy-run-pipeline = "semantic_entropy.pipeline_cli:main"
semantic-entropy-score-jsonl = "semantic_entropy.cli:main"
semantic-entropy-aggregate-results = "semantic_entropy.result_aggregator:main"

[project.optional-dependencies]
test = ["pytest>=8"]
# Data preparation scripts (prepare_triviaqa.py, prepare_svamp.py).
# Install with: uv pip install --extra prep  or  uv sync --extra prep
prep = [
    "datasets>=2.14",
]
plot = [
    "matplotlib>=3.8",
]
hf = [
    "torch",
    "transformers",
    "accelerate",
]
vllm = [
    "vllm",
]
# Kernel Language Entropy: embedding-based soft uncertainty score.
# See src/semantic_entropy/kle.py.
kle = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
]
# Semantic Entropy Probes: linear classifier over hidden states.
# See src/semantic_entropy/probes.py.
sep = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
