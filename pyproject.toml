[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-entropy-thesis"
version = "0.1.0"
description = "Code for the thesis Detecting Hallucinations in Large Language Models Using Semantic Entropy."
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.5",
]

[project.scripts]
semantic-entropy-normalize-fixture = "semantic_entropy.fixtures:main"
semantic-entropy-metrics-jsonl = "semantic_entropy.metrics:main"
semantic-entropy-make-presampling-jsonl = "semantic_entropy.harness:main"
semantic-entropy-run-pipeline = "semantic_entropy.pipeline_cli:main"
semantic-entropy-score-jsonl = "semantic_entropy.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.4"]
# Data preparation (scripts/prepare_replication_data.py).
# Install with: uv pip install --extra prep  or  uv sync --extra prep
prep = [
    # Datasets 5.0 / Hub 1.18 currently fail to resolve legacy Hub dataset IDs
    # such as trivia_qa on the Alex cluster install path.
    "datasets>=2.14,<5",
    "huggingface-hub<1.18",
]
plot = [
    "matplotlib>=3.8",
]
hf = [
    "torch",
    "transformers",
    "accelerate",
    "protobuf",
    "sentencepiece",
    "tiktoken",
]
vllm = [
    "vllm",
]
# Kernel Language Entropy: embedding-based soft uncertainty score.
# See src/semantic_entropy/kle.py.
kle = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
]
# Semantic Entropy Probes: linear classifier over hidden states.
# See src/semantic_entropy/probes.py.
sep = [
    "numpy>=1.24",
    # Upper bound is deliberate: probes.py passes penalty="l2" to
    # LogisticRegression, which is deprecated in sklearn 1.8 and removed in
    # 1.10. uv.lock pins 1.8.0; this keeps `pip install -e '.[sep]'` working too.
    "scikit-learn>=1.3,<1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
